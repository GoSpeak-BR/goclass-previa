<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="description" content="Prévia do GoSchool: salas isoladas de aula, mentoria e estudo."><title>GoSchool Apresentação</title><link rel="icon" href="../favicon.ico"></head><body>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0b1a13;color:#f0f8f3;font:700 15px/1.3 Nunito,system-ui,sans-serif;overflow:hidden}
main{position:fixed;inset:0 0 52px;display:grid;place-items:center}
#quadro{position:relative;width:min(100vw,calc((100vh - 52px)*16/9));aspect-ratio:16/9;background:#10241b}
#quadro img{display:block;width:100%;height:100%}
#quadro a{position:absolute;display:block;border-radius:12px}
#quadro a:focus-visible,button:focus-visible{outline:3px solid #6bdfa3;outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:#10241b}
button,nav a{border:1px solid #3f5b4b;border-radius:10px;padding:7px 14px;background:transparent;color:#f0f8f3;font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
button:hover,nav a:hover{background:#20372a}
#conta{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:520px){#tela{display:none}}
</style>
<main><div id="quadro"><img id="slide" alt=""></div></main>
<nav aria-label="Slides"><button id="antes" aria-label="Slide anterior">‹</button><span id="conta" aria-live="polite"></span><button id="depois" aria-label="Próximo slide">›</button><button id="tela">Tela cheia</button><a href="../">Abrir a prévia</a></nav>
<script>
const SLIDES=[{"src":"slides/01.webp","texto":"Sala  i olada \npara aula,\nmentoria\ne e tudo. Prévia e propo ta de piloto para [nome da e cola]. [data da apre entação]","links":[]},{"src":"slides/02.webp","texto":"O que falta na aula online. Pre ença incerta. Abrir um link não mo tra quem e tá me mo na aula.. Dúvida e condida. O profe or  ó de cobre quem não entendeu depoi  da prova.. Mentoria  olta. Meta  e combinado   e perdem entre men agen  e planilha .","links":[]},{"src":"slides/03.webp","texto":"Trê   ala . Nenhum corredor.. Sala de aula. O profe or e a turma.. Sala de mentoria. O aluno e o mentor.. Sala de e tudo. A turma e o monitor.","links":[]},{"src":"slides/04.webp","texto":"Sala de aula. Entrou, e tá na chamada. Lugar marcado na  ala. Lou a ao vivo. Mão levantada em fila","links":[]},{"src":"slides/05.webp","texto":"A turma re ponde, o profe or vê na hora. 10 de 12. acertaram durante a aula. Exemplo com a turma  imulada da prévia.","links":[]},{"src":"slides/06.webp","texto":"Sala de aula. Toda aula termina com um relatório. Pre ença e atra o  pronto. Acerto  por aluno. Quem deve ir para a mentoria. Avi o de falta para a  ecretaria","links":[]},{"src":"slides/07.webp","texto":"A aula aponta quem preci a de mentoria. Aula. O aluno erra uma pergunta.. Relatório. O profe or vê a indicação.. Mentoria. Aluno e mentor fazem um plano.. E tudo. Ele pratica com o monitor.. A  pe oa   eguem em  ala   eparada . Só a indicação pa a de uma  ala para a outra, e o aluno volta mai  preparado.","links":[]},{"src":"slides/08.webp","texto":"Sala de mentoria. Só o aluno e o mentor. Meta , anotaçõe  e próximo encontro no me mo lugar.","links":[]},{"src":"slides/09.webp","texto":"Sala de e tudo. E tudar junto, com monitor por perto. O monitor vem até a me a. Arquivo  e link  da turma","links":[]},{"src":"slides/10.webp","texto":"Sala de e tudo. Tempo dividido em bloco  de foco. 15 + 3, 25 + 5 ou 50 + 10. Minuto  de foco e de pau a, com pau a longa depoi  de quatro bloco .. Mú ica lofi na  ala. Trê  ambiente , gerado  na hora,  em depender de outro  erviço.","links":[]},{"src":"slides/11.webp","texto":"Painel do diretor. Tudo o que importa, em uma tela. O diretor vê o  re ultado  e o andamento da   ala ,  em ouvir o que é dito lá dentro.","links":[]},{"src":"slides/12.webp","texto":"Painel do diretor. Agenda de aula  da  emana. Aula , mentoria  e e tudo  na me ma grade.. Conflito de horário avi ado na hora.. Troca de re pon ável direto na aula.","links":[]},{"src":"slides/13.webp","texto":"Painel do diretor. Cada  ala tem um re pon ável. Re pon ável. Área. Turma. Na  emana. Profa. Helena. Matemática. 7ºA, 8ºB. 4 aula. Prof. Rui. Ciência. 7ºA, 8ºB. 3 aula. Profa. Bianca. Portuguê. 7ºA, 8ºB. 3 aula. Marina. Mentoria. Individual. 3 encontro. Pedro. Monitoria. Sala aberta. 3  e õe. Nome  e número  de exemplo.","links":[]},{"src":"slides/14.webp","texto":"Vamo  entrar na   ala. Primeiro como aluno. Depoi  como profe or, monitor e diretor.. Abrir a prévia","links":[{"texto":"Abrir a prévia","x":6.666666666666667,"y":66.62037037037037,"w":14.13818359375,"h":6.944444444444444}]},{"src":"slides/15.webp","texto":"O que “i olada” garante no piloto. Convite. Só entra quem a e cola colocou naquela  ala.. Conver a. Voz, lou a e men agen  não  aem da  ala.. Menore  de idade. Câmera de ligada por padrão e autorização do  re pon ávei .. Dado  da turma. A e cola define quem vê pre ença e nota , conforme a LGPD.","links":[]},{"src":"slides/16.webp","texto":"O que exi te e o que falta. Em produção. No GoWork e no GoPlay. Mapa e per onagen. Voz e vídeo. Tela compartilhada. Na prévia. Com pe oa   imulada. A  trê   ala. Painel e agenda. Timer e mú ica. Relatório da aula. A con truir. Ante  do piloto. Ace o e turma  reai. Voz na   ala. Dado  e arquivo   alvo. Regra  para menore","links":[]},{"src":"slides/17.webp","texto":"Ideia  para depoi  do piloto. Fora do e copo agora. Entram  e a e cola pedir.. Portal do  re pon ávei. Pre ença, avi o  e recado  da e cola.. Re umo da aula. O  ponto  principai  para quem faltou.. Trilha de recuperação. Da dificuldade ao plano com mentor e monitor.. Conqui ta  de e tudo. Sequência de dia  e bloco  de foco.","links":[]},{"src":"slides/18.webp","texto":"Piloto propo to: [4]  emana. [2] turma , [3] mentore  e [1] monitor, com a no a equipe acompanhando.. Ante  de começar. Preparação. Turma , cada tro  e autorizaçõe .. Semana 1. Primeira  aula. Treino rápido, com a equipe na  ala.. Semana  2 e 3. Rotina real. Aula  e mentoria , com aju te   emanai .. Semana 4. Deci ão. Ampliar, aju tar ou parar, com dado .","links":[]},{"src":"slides/19.webp","texto":"Como  aber  e funcionou. Indicador. Como medimo. Meta. Pre ença. Chamada automática de cada aula. [__]%. Participação. Aluno  que re ponderam à  pergunta. [__]%. Mentoria. Encontro  feito   obre o  agendado. [__]%. E tudo. Hora  de foco na  ala de e tudo. [__] h. Sati fação. Pe qui a com aluno  e profe ore. [__] de 10. E tabilidade. Aula   em queda de áudio ou de  ala. [__]%","links":[]},{"src":"slides/20.webp","texto":"O que preci amo  decidir. Turma , mentore  e monitore. Re pon ável pela e cola. Início: [data]. Condiçõe : [valor]. [ eu nome] · [ eu contato]","links":[]}];
const img=document.getElementById('slide'),quadro=document.getElementById('quadro'),conta=document.getElementById('conta');
let i=Math.min(SLIDES.length-1,Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1));
function ir(n){i=Math.min(SLIDES.length-1,Math.max(0,n));const s=SLIDES[i];img.src=s.src;img.alt=s.texto;conta.textContent=(i+1)+' de '+SLIDES.length;
quadro.querySelectorAll('a').forEach(a=>a.remove());
for(const l of s.links){const a=document.createElement('a');a.href='../';a.setAttribute('aria-label',l.texto);a.style.cssText='left:'+l.x+'%;top:'+l.y+'%;width:'+l.w+'%;height:'+l.h+'%';quadro.append(a)}
history.replaceState(null,'','#'+(i+1));for(const v of [i-1,i+1])if(SLIDES[v])new Image().src=SLIDES[v].src}
document.getElementById('antes').onclick=()=>ir(i-1);document.getElementById('depois').onclick=()=>ir(i+1);
document.getElementById('tela').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)&&!e.target.matches('a,button')){e.preventDefault();ir(i+1)}if(['ArrowRight','PageDown'].includes(e.key)&&e.target.matches('a,button')){ir(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();ir(i-1)}if(e.key==='Home')ir(0);if(e.key==='End')ir(SLIDES.length-1)});
let x0=null;addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)ir(i+(d<0?1:-1));x0=null},{passive:true});
ir(i);
</script></body></html>
