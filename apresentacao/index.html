<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="description" content="Prévia do GoSchool: salas isoladas de aula, mentoria e estudo."><title>GoSchool Apresentação</title><link rel="icon" href="../favicon.ico"></head><body>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0b1a13;color:#f0f8f3;font:700 15px/1.3 Nunito,system-ui,sans-serif;overflow:hidden}
main{position:fixed;inset:0 0 52px;display:grid;place-items:center}
#quadro{position:relative;width:min(100vw,calc((100vh - 52px)*16/9));aspect-ratio:16/9;background:#10241b}
#quadro img{display:block;width:100%;height:100%}
#quadro a{position:absolute;display:block;border-radius:12px}
#quadro a:focus-visible,button:focus-visible{outline:3px solid #6bdfa3;outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:#10241b}
button,nav a{border:1px solid #3f5b4b;border-radius:10px;padding:7px 14px;background:transparent;color:#f0f8f3;font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
button:hover,nav a:hover{background:#20372a}
#conta{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:520px){#tela{display:none}}
</style>
<main><div id="quadro"><img id="slide" alt=""></div></main>
<nav aria-label="Slides"><button id="antes" aria-label="Slide anterior">‹</button><span id="conta" aria-live="polite"></span><button id="depois" aria-label="Próximo slide">›</button><button id="tela">Tela cheia</button><a href="../">Abrir a prévia</a></nav>
<script>
const SLIDES=[{"src":"slides/01.webp","texto":"Salas isoladas para aula, mentoria e estudo. Prévia e proposta de piloto para [nome da escola]. [data da apresentação]","links":[]},{"src":"slides/02.webp","texto":"O que falta na aula online. Presença incerta. Abrir um link não mostra quem está mesmo na aula.. Dúvida escondida. O professor só descobre quem não entendeu depois da prova.. Mentoria solta. Metas e combinados se perdem entre mensagens e planilhas.","links":[]},{"src":"slides/03.webp","texto":"Três salas. Nenhum corredor.. Sala de aula. O professor e a turma.. Sala de mentoria. O aluno e o mentor.. Sala de estudos. A turma e o monitor.","links":[]},{"src":"slides/04.webp","texto":"Sala de aula. Entrou, está na chamada. Lugar marcado na sala. Lousa ao vivo. Mão levantada em fila","links":[]},{"src":"slides/05.webp","texto":"A turma responde, o professor vê na hora. 10 de 12. acertaram durante a aula. Exemplo com a turma simulada da prévia.","links":[]},{"src":"slides/06.webp","texto":"Sala de aula. Toda aula termina com um relatório. Presença e atrasos prontos. Acertos por aluno. Quem deve ir para a mentoria. Aviso de falta para a secretaria","links":[]},{"src":"slides/07.webp","texto":"A aula aponta quem precisa de mentoria. Aula. O aluno erra uma pergunta.. Relatório. O professor vê a indicação.. Mentoria. Aluno e mentor fazem um plano.. Estudos. Ele pratica com o monitor.. As pessoas seguem em salas separadas. Só a indicação passa de uma sala para a outra, e o aluno volta mais preparado.","links":[]},{"src":"slides/08.webp","texto":"Sala de mentoria. Só o aluno e o mentor. Metas, anotações e próximo encontro no mesmo lugar.","links":[]},{"src":"slides/09.webp","texto":"Sala de estudos. Estudar junto, com monitor por perto. O monitor vem até a mesa. Arquivos e links da turma","links":[]},{"src":"slides/10.webp","texto":"Sala de estudos. Tempo dividido em blocos de foco. 15 + 3, 25 + 5 ou 50 + 10. Minutos de foco e de pausa, com pausa longa depois de quatro blocos.. Música lofi na sala. Três ambientes, gerados na hora, sem depender de outro serviço.","links":[]},{"src":"slides/11.webp","texto":"Painel do diretor. Tudo o que importa, em uma tela. O diretor vê os resultados e o andamento das salas, sem ouvir o que é dito lá dentro.","links":[]},{"src":"slides/12.webp","texto":"Painel do diretor. Agenda de aulas da semana. Aulas, mentorias e estudos na mesma grade.. Conflito de horário avisado na hora.. Troca de responsável direto na aula.","links":[]},{"src":"slides/13.webp","texto":"Painel do diretor. Cada sala tem um responsável. Responsável. Área. Turmas. Na semana. Profa. Helena. Matemática. 7ºA, 8ºB. 4 aulas. Prof. Rui. Ciências. 7ºA, 8ºB. 3 aulas. Profa. Bianca. Português. 7ºA, 8ºB. 3 aulas. Marina. Mentoria. Individual. 3 encontros. Pedro. Monitoria. Sala aberta. 3 sessões. Nomes e números de exemplo.","links":[]},{"src":"slides/14.webp","texto":"Vamos entrar nas salas. Primeiro como aluno. Depois como professor, monitor e diretor.. Abrir a prévia","links":[{"texto":"Abrir a prévia","x":6.666666666666667,"y":66.62037037037037,"w":14.13818359375,"h":6.944444444444444}]},{"src":"slides/15.webp","texto":"O que “isolada” garante no piloto. Convite. Só entra quem a escola colocou naquela sala.. Conversa. Voz, lousa e mensagens não saem da sala.. Menores de idade. Câmera desligada por padrão e autorização dos responsáveis.. Dados da turma. A escola define quem vê presença e notas, conforme a LGPD.","links":[]},{"src":"slides/16.webp","texto":"O que existe e o que falta. Em produção. No GoWork e no GoPlay. Mapa e personagens. Voz e vídeo. Tela compartilhada. Na prévia. Com pessoas simuladas. As três salas. Painel e agenda. Timer e música. Relatório da aula. A construir. Antes do piloto. Acesso e turmas reais. Voz nas salas. Dados e arquivos salvos. Regras para menores","links":[]},{"src":"slides/17.webp","texto":"Ideias para depois do piloto. Fora do escopo agora. Entram se a escola pedir.. Portal dos responsáveis. Presença, avisos e recados da escola.. Resumo da aula. Os pontos principais para quem faltou.. Trilha de recuperação. Da dificuldade ao plano com mentor e monitor.. Conquistas de estudo. Sequência de dias e blocos de foco.","links":[]},{"src":"slides/18.webp","texto":"Piloto proposto: [4] semanas. [2] turmas, [3] mentores e [1] monitor, com a nossa equipe acompanhando.. Antes de começar. Preparação. Turmas, cadastros e autorizações.. Semana 1. Primeiras aulas. Treino rápido, com a equipe na sala.. Semanas 2 e 3. Rotina real. Aulas e mentorias, com ajustes semanais.. Semana 4. Decisão. Ampliar, ajustar ou parar, com dados.","links":[]},{"src":"slides/19.webp","texto":"Como saber se funcionou. Indicador. Como medimos. Meta. Presença. Chamada automática de cada aula. [__]%. Participação. Alunos que responderam às perguntas. [__]%. Mentorias. Encontros feitos sobre os agendados. [__]%. Estudo. Horas de foco na sala de estudos. [__] h. Satisfação. Pesquisa com alunos e professores. [__] de 10. Estabilidade. Aulas sem queda de áudio ou de sala. [__]%","links":[]},{"src":"slides/20.webp","texto":"O que precisamos decidir. Turmas, mentores e monitores. Responsável pela escola. Início: [data]. Condições: [valor]. [seu nome] · [seu contato]","links":[]}];
const img=document.getElementById('slide'),quadro=document.getElementById('quadro'),conta=document.getElementById('conta');
let i=Math.min(SLIDES.length-1,Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1));
function ir(n){i=Math.min(SLIDES.length-1,Math.max(0,n));const s=SLIDES[i];img.src=s.src;img.alt=s.texto;conta.textContent=(i+1)+' de '+SLIDES.length;
quadro.querySelectorAll('a').forEach(a=>a.remove());
for(const l of s.links){const a=document.createElement('a');a.href='../';a.setAttribute('aria-label',l.texto);a.style.cssText='left:'+l.x+'%;top:'+l.y+'%;width:'+l.w+'%;height:'+l.h+'%';quadro.append(a)}
history.replaceState(null,'','#'+(i+1));for(const v of [i-1,i+1])if(SLIDES[v])new Image().src=SLIDES[v].src}
document.getElementById('antes').onclick=()=>ir(i-1);document.getElementById('depois').onclick=()=>ir(i+1);
document.getElementById('tela').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)&&!e.target.matches('a,button')){e.preventDefault();ir(i+1)}if(['ArrowRight','PageDown'].includes(e.key)&&e.target.matches('a,button')){ir(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();ir(i-1)}if(e.key==='Home')ir(0);if(e.key==='End')ir(SLIDES.length-1)});
let x0=null;addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)ir(i+(d<0?1:-1));x0=null},{passive:true});
ir(i);
</script></body></html>
